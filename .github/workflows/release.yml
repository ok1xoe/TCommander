name: Release

# Spustí se pushnutím tagu v* (např. v0.1.0), nebo ručně (pak se balíčky jen nahrají jako artefakt).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # Volitelné secrets pro podpis Developer ID a notarizaci (viz docs/release.md); bez nich se aplikace podepíše ad-hoc.
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
      NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
      NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Verze z tagu
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-dev"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Testy
        run: swift test

      - name: Import podpisového certifikátu
        if: env.MACOS_CERTIFICATE != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/certificate.p12"

      - name: Sestavení, podpis a balíčky
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          if [ -n "$MACOS_CERTIFICATE" ] && [ -n "$MACOS_SIGNING_IDENTITY" ]; then export CODESIGN_IDENTITY="$MACOS_SIGNING_IDENTITY"; fi
          scripts/package.sh

      - name: Artefakty
        uses: actions/upload-artifact@v4
        with:
          name: TCommander-${{ steps.version.outputs.version }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/SHA256SUMS.txt

      - name: Release na GitHubu
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -n "$MACOS_CERTIFICATE" ] && [ -n "$MACOS_SIGNING_IDENTITY" ] && [ -n "$NOTARY_APPLE_ID" ]; then
            SIGN_NOTE="The app is signed with a Developer ID and notarized, so it opens without any warning after download."
          else
            SIGN_NOTE="The app is signed ad-hoc (without an Apple Developer ID), so macOS asks for confirmation the first time you open a downloaded copy – see Installation below."
          fi
          cat > notes.md <<NOTES
          ## TCommander $VERSION

          A native two-panel file manager for macOS (two panels and tabs, viewer and editor with syntax highlighting, Markdown reader, search, compare and synchronize, archives, FTP/SFTP/SMB/WebDAV, terminal, plugins). Requires macOS 14 or later; universal app (Apple silicon and Intel).

          **User guide:** https://ok1xoe.github.io/TCommander/ (also built into the app: Help menu).

          $SIGN_NOTE

          ### Installation
          1. Download \`TCommander-$VERSION.dmg\` (or the \`.zip\`) and drag \`TCommander.app\` to your Applications folder.
          2. First launch of an ad-hoc signed app: right-click the app › **Open** › **Open**, or run \`xattr -dr com.apple.quarantine /Applications/TCommander.app\` in Terminal.
          3. PlantUML diagrams need PlantUML and Java (\`brew install plantuml\`).

          SHA-256 checksums are in \`SHA256SUMS.txt\`.

          NOTES
          gh release create "$GITHUB_REF_NAME" dist/TCommander-$VERSION.zip dist/TCommander-$VERSION.dmg dist/SHA256SUMS.txt \
            --title "TCommander $VERSION" --notes-file notes.md --generate-notes --verify-tag
