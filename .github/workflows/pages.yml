name: Web a příručka (GitHub Pages)

# Při změně příručky nebo generátoru vytvoří web (docs/manual + docs/web → site/) a nasadí ho na GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - 'docs/manual/**'
      - 'docs/web/**'
      - 'Sources/DocsBuilder/**'
      - 'Sources/TCCore/MarkdownHTML.swift'
      - 'Sources/TCCore/Commands.swift'
      - 'Sources/TCCore/Localization.swift'
      - 'appstore/AppIcon.icns'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Sestavení webu
        env:
          APPSTORE_URL: ${{ vars.APPSTORE_URL }}
          SITE_URL: ${{ vars.SITE_URL }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
        run: scripts/build_site.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
