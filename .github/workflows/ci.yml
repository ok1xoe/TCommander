name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verze nástrojů
        run: |
          swift --version
          xcodebuild -version
      - name: Sestavení
        run: swift build
      - name: Testy
        run: swift test
